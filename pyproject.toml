[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgopt"
version = "0.1.0"
description = "Safe user-space ML-assisted background-process optimisation prototype"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "psutil>=5.9",
  "scikit-learn>=1.3",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
bgopt = "bgopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
